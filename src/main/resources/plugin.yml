name: CustomPlugin
version: '${version}'

main: net.rose.customPlugin.CustomPlugin
paper-plugin-loader: net.rose.customPlugin.CustomPluginLoader
api-version: '1.21.11'
load: POSTWORLD

authors: [ PumpkinDev ]
contributors:
  - Vishini
  - Magnet108
  - Chapalulu



commands:
  customplugin:
    description: Reload or reset config.yml (weapon tiers, prices and points)
    usage: /customplugin <reload|reset>
    permission: customplugin.reload

  weapon:
    description: Give yourself (or another player) a custom weapon
    usage: /weapon <name> [player]
    aliases: [ weapons ]
    permission: customplugin.weapon

  weaponpack:
    description: Get the weapon texture pack (status shows the pack server, reload rebuilds it)
    usage: /weaponpack [status|reload]
    permission: customplugin.weaponpack

  weaponpoints:
    description: Open the weapon points menu (the weapons you carry, what they cost, and how many points you are using)
    usage: /weaponpoints
    aliases: [ wpoints ]
    permission: customplugin.weaponpoints

  shop:
    description: Open the weapon shop (buy weapons with kill tokens)
    usage: /shop
    aliases: [ weaponshop ]
    permission: customplugin.shop

permissions:
  customplugin.reload:
    description: Allows /customplugin reload and reset
    default: op
  customplugin.weapon:
    description: Allows use of /weapon
    default: op
  customplugin.weaponpack:
    description: Allows /weaponpack
    default: true
  customplugin.weaponpack.reload:
    description: Allows /weaponpack reload
    default: op
  customplugin.weaponpoints:
    description: Allows /weaponpoints
    default: true
  customplugin.shop:
    description: Allows /shop
    default: true
  customplugin.weaponlimit.bypass:
    description: Not affected by the weapon limit (weapon-limit in config.yml)
    default: false
  customplugin.combat.bypass:
    description: Never put in combat, and can always run commands (combat in config.yml)
    default: false
