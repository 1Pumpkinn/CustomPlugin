name: CustomPlugin
version: '${version}'

main: net.rose.customPlugin.CustomPlugin
paper-plugin-loader: net.rose.customPlugin.CustomPluginLoader
api-version: '1.21.11'
load: POSTWORLD

authors: [ PumpkinDev ]

commands:
  weapon:
    description: Give yourself (or another player) a custom weapon
    usage: /weapon <name> [player]
    aliases: [ weapons ]
    permission: customplugin.weapon

  weaponpack:
    description: Get the weapon texture pack (status shows the pack server, reload rebuilds it)
    usage: /weaponpack [status|reload]
    permission: customplugin.weaponpack

  shop:
    description: Open the weapon shop and buy weapons with points
    usage: /shop
    aliases: [ weaponshop ]
    permission: customplugin.shop

  points:
    description: Check your points (admins can give, take or set them)
    usage: /points [give|take|set <player> <amount>]
    permission: customplugin.points

permissions:
  customplugin.weapon:
    description: Allows use of /weapon
    default: op
  customplugin.weaponpack:
    description: Allows /weaponpack
    default: true
  customplugin.weaponpack.reload:
    description: Allows /weaponpack reload
    default: op
  customplugin.shop:
    description: Allows /shop
    default: true
  customplugin.points:
    description: Allows /points
    default: true
  customplugin.points.admin:
    description: Allows /points give, take and set
    default: op
