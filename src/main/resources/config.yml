# Weapon texture pack. The pack lives in the repo under resourcepack/ and is built into CustomPlugin-Pack.zip.
resource-pack:
  # Set to false to stop sending the pack.
  enabled: true
  # Direct download link to the zip. The default is the zip in the CustomPlugin repo (it works once the pack is pushed
  # to master); point it at any other direct link to host the pack yourself.
  url: "https://raw.githubusercontent.com/1Pumpkinn/CustomPlugin/master/resourcepack/CustomPlugin-Pack.zip"
  # SHA-1 of the zip (40 hex characters). Leave blank and the plugin works it out by downloading the zip on startup/reload.
  sha1: ""
  # Players who decline (or fail to download) the pack are kicked. Only applied when the hash is known.
  required: false
  # Text shown on the client's resource pack prompt.
  prompt: "CustomPlugin weapon textures"
  # Ticks to wait after a player joins before the pack is sent.
  send-delay-ticks: 20
