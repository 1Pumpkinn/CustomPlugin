# Weapon texture pack. The pack is bundled inside this plugin's jar (src/main/resources/customplugin/) and served
# by a tiny built-in web server, so there is nothing to upload or link. Players only re-download it when it changes.
# After editing this section run /weaponpack reload.
resource-pack:
  # Set to false to stop sending the pack.
  enabled: true
  # What players connect to for the download: your server's public IP or domain, without http:// or a port
  # (use localhost when testing on your own PC).
  host: localhost
  # TCP port the plugin opens for the download. It has to be open / forwarded on your server.
  port: 8080
  # Interface to listen on (0.0.0.0 = all).
  bind-address: 0.0.0.0
  # Players who decline (or fail to download) the pack are kicked.
  required: false
  # Text shown on the client's resource pack prompt.
  prompt: "CustomPlugin weapon textures"

# Dropped weapons shoot a blinking beam of particles into the sky, in the weapon's own color (red for the scythe,
# yellow for the Zeus Disc...), so they can be spotted from far away.
dropped-item-beacon:
  enabled: true
  # Blink the beam on and off instead of keeping it solid.
  blink: true
  # How tall the beam is, in blocks.
  height: 64
  # Blocks between particles in the beam (bigger = fewer particles).
  spacing: 1.5
  # Size of each particle (0.5 - 4).
  size: 2.5
  # How often the beam is redrawn. While blinking, every redraw switches the beam on or off, so this is half a blink.
  interval-ticks: 10

# Bumped by the plugin when this file's layout changes. Don't edit it. (An older config.yml is backed up to
# config-backup-v1.yml and upgraded on startup; your values are carried over.)
config-version: 2

# After editing anything in this file run  /customplugin reload  (or restart). /customplugin reset puts the defaults back. No need to restart for tiers,
# points, prices or the Hat / Petal Blade settings. Dropped-item beacon and resource-pack settings need
# /weaponpack reload or a restart.

# =====================================================================================================================
# WEAPONS - the one place to change a weapon's tier and price.
# The id is the weapon's /weapon name.
#   tier:   1 = best / most expensive. What a tier costs in weapon points is set in weapon-limit.tier-points.
#   price:  kill tokens it costs in /shop. Leave it out to use the tier's price (shop.tier-prices).
#   points: weapon points it uses. Leave it out to use the tier's points (weapon-limit.tier-points).
# =====================================================================================================================
weapons:
  tideblade:
    tier: 1
    price: 8
  petalblade:
    tier: 1
    price: 16
  tempesttrident:
    tier: 2
    price: 24
  hat:
    tier: 2
    price: 32
  tricksterbow:
    tier: 2
    price: 32
  zeusdisc:
    tier: 2
    price: 48
  frostspear:
    tier: 1
    price: 48
  volcanicaxe:
    tier: 2
    price: 48
  bloodthirstscythe:
    tier: 1
    price: 72
  metalicmace:
    tier: 1
    price: 80

# Weapon points. Every custom weapon in a player's inventory costs points, depending on its tier (see weapons above).
# When the weapons a player carries add up to more than max-points, the weapon that goes over is disabled: it can't
# be used for its abilities or to attack until the player drops or gets rid of enough other weapons. Weapons are
# counted oldest first (the order the player picked them up in), so the newest weapon is the one that gets disabled.
# /weaponpoints opens a menu showing the weapons a player carries and how many points they are using.
# Players with the customplugin.weaponlimit.bypass permission are not limited.
weapon-limit:
  enabled: true
  max-points: 6
  # Points each tier costs. Add tiers freely (every tier used in weapons needs an entry here).
  tier-points:
    1: 3
    2: 2
    3: 1
  # Tier for any weapon with no tier under weapons (new weapons stay expensive until you place them).
  default-tier: 1

# /shop: weapons are bought with kill tokens (the red dye a player drops when they die in PvP).
# A weapon's price is weapons.<id>.price if set, otherwise its tier's price below, otherwise default-price.
# Buying has no effect on the weapon limit: a weapon bought past weapon-limit.max-points is simply disabled until
# the player has the room for it.
shop:
  # Kill tokens each tier costs.
  tier-prices:
    1: 5
    2: 3
    3: 2
  # Price for a tier that is not listed above.
  default-price: 5

# Old Man's Hat. F (offhand key) throws the bounce hat; Crouch + F throws the razor hat.
hat:
  bounce:
    # Upward launch speed, in blocks per tick (1.6 is roughly a 20+ block jump).
    vertical-boost: 1.6
    # Extra push in the direction the bouncer is facing, in blocks per tick. 0 = straight up.
    horizontal-boost: 1.4
    # A bounce hat that has flown further than this many blocks from the thrower freezes in the air
    # and works as a jump pad right where it is. Set to 0 to turn this off.
    freeze-distance: 5.0
    # How long the pad stays out once it has landed or frozen, in ticks (20 ticks = 1 second).
    lifetime-ticks: 50
    cooldown-seconds: 20

# Petal Blade.
petal-blade:
  # Show the cherry-leaf petals circling the player (and the cherry leaf particles and sounds) after priming.
  # false = priming shows only the boss bar. Thrown petals are always visible.
  show-orbiting-petals: true
  cooldown-seconds: 30

