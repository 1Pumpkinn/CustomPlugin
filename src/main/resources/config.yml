# Weapon texture pack. The pack is bundled inside this plugin's jar (src/main/resources/customplugin/) and served
# by a tiny built-in web server, so there is nothing to upload or link. Players only re-download it when it changes.
# After editing this section run /weaponpack reload.
resource-pack:
  # Set to false to stop sending the pack.
  enabled: true
  # What players connect to for the download: your server's public IP or domain, without http:// or a port
  # (use localhost when testing on your own PC).
  host: localhost
  # TCP port the plugin opens for the download. It has to be open / forwarded on your server.
  port: 8080
  # Interface to listen on (0.0.0.0 = all).
  bind-address: 0.0.0.0
  # Players who decline (or fail to download) the pack are kicked.
  required: false
  # Text shown on the client's resource pack prompt.
  prompt: "CustomPlugin weapon textures"
