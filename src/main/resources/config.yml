# Weapon texture pack. The pack is bundled inside this plugin's jar (src/main/resources/customplugin/) and served
# by a tiny built-in web server, so there is nothing to upload or link. Players only re-download it when it changes.
# After editing this section run /weaponpack reload.
resource-pack:
  # Set to false to stop sending the pack.
  enabled: true
  # What players connect to for the download: your server's public IP or domain, without http:// or a port
  # (use localhost when testing on your own PC).
  host: localhost
  # TCP port the plugin opens for the download. It has to be open / forwarded on your server.
  port: 8080
  # Interface to listen on (0.0.0.0 = all).
  bind-address: 0.0.0.0
  # Players who decline (or fail to download) the pack are kicked.
  required: false
  # Text shown on the client's resource pack prompt.
  prompt: "CustomPlugin weapon textures"

# Dropped weapons shoot a blinking beam of particles into the sky, in the weapon's own color (red for the scythe,
# yellow for the Zeus Disc...), so they can be spotted from far away.
dropped-item-beacon:
  enabled: true
  # Blink the beam on and off instead of keeping it solid.
  blink: true
  # How tall the beam is, in blocks.
  height: 64
  # Blocks between particles in the beam (bigger = fewer particles).
  spacing: 1.5
  # Size of each particle (0.5 - 4).
  size: 2.5
  # How often the beam is redrawn. While blinking, every redraw switches the beam on or off, so this is half a blink.
  interval-ticks: 10

# Weapon points. Every custom weapon in a player's inventory costs points, depending on its tier (tier 1 is the
# highest and costs the most points, tier 3 the lowest). A tier costs the
# points set in tier-points, and weapon-tiers says which tier each weapon is in. Add or rename tiers freely, as long
# as every tier used in weapon-tiers has an entry in tier-points.
#
# When the weapons a player carries add up to more than max-points, the weapon that goes over is disabled: it can't
# be used for its abilities or to attack until the player drops or gets rid of enough other weapons. Weapons are
# counted oldest first (the order the player picked them up in), so the newest weapon is the one
# that gets disabled. /weaponpoints opens a menu showing the weapons a player carries and how many points they are
# using. Players with the customplugin.weaponlimit.bypass permission are not limited.
weapon-limit:
  enabled: true
  max-points: 6
  # Points each tier costs.
  tier-points:
    1: 3
    2: 2
    3: 1
  # Tier of each weapon, by its /weapon name.
  weapon-tiers:
    zeusdisc: 2
    bloodthirstscythe: 1
    tempesttrident: 2
    tideblade: 1
    volcanicaxe: 2
    frostspear: 1
    tricksterbow: 2
    metalicmace: 1
    petalblade: 1
    hat: 2
  # Tier for any weapon not listed in weapon-tiers (new weapons stay expensive until you place them).
  default-tier: 1

# /shop: weapons are bought with kill tokens (the red dye a player drops when they die in PvP). A weapon costs its
# tier's price (tiers come from weapon-limit.weapon-tiers above); add a weapon's /weapon name under shop to give it its own
# price instead, e.g. "zeusdisc: 10" (shop.weapon-prices.<name> works too). Buying has no effect on the weapon limit: a weapon bought past
# weapon-limit.max-points is simply disabled until the player has the room for it.
shop:
  # Kill tokens each tier costs.
  tier-prices:
    1: 5
    2: 3
    3: 2
  # Price for a tier that is not listed above.
  default-price: 5
  # Per-weapon prices, by /weapon name (these win over tier-prices):
  tideblade: 8
  petalblade: 16
  tempesttrident: 24
  hat: 32
  tricksterbow: 32
  zeusdisc: 48
  frostspear: 48
  volcanicaxe: 48
  bloodthirstscythe: 72
  metalicmace: 80